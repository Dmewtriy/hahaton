<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1420" viewBox="0 0 2000 1420"><rect width="2000" height="1420" fill="#f2f5f8"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><text x="60" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#10293b">Корсик / модель данных и доступ</text><text x="62" y="123" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Основные сущности и связи. Пользовательские тексты и токены не попадают в технические логи.</text><rect x="60" y="170" width="570" height="270" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="170" width="7" height="270" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="85" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Организация и доступ</text><text x="85" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Identity → roles[], manage_access, MAX binding</text><text x="85" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Branch → timezone, календарь, Scenario</text><text x="85" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Department → Branch, руководитель</text><text x="85" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Employee → Identity + Branch + Department</text><text x="85" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Employee → recruiter_id + manager_id</text><text x="85" y="407" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">WebSession / Invitation / AssignmentHistory</text><rect x="710" y="170" width="570" height="270" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="710" y="170" width="7" height="270" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="735" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Конфигурация и исполнение</text><text x="735" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Scenario(version, definition snapshot)</text><text x="735" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Scenario → ScheduledStep(employee, due, order)</text><text x="735" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">ScheduledStep → RouteRun(position, answers)</text><text x="735" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">ScheduledStep → SurveyRun(definition, expires)</text><text x="735" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">SurveyRun → SurveyAnswer(value, comment)</text><text x="735" y="407" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">SurveyAnswer → FeedbackAnalysis(version)</text><rect x="1370" y="170" width="570" height="270" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1370" y="170" width="7" height="270" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="1395" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Рассылки и контент</text><text x="1395" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">SurveyTemplate → Campaign</text><text x="1395" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Campaign → CampaignRecipient → Step</text><text x="1395" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Document family → version → index status</text><text x="1395" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Material(key, source_ref) → Document / URL</text><text x="1395" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Employee → personal plan / IT-access URL</text><text x="1395" y="407" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Контент меняется через HR CRUD</text><rect x="60" y="535" width="570" height="245" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="535" width="7" height="245" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="85" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Поддержка и помощь</text><text x="85" y="617" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Employee → Ticket → TicketMessage</text><text x="85" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Employee → HRMessage → HRReadState</text><text x="85" y="679" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Ticket → TicketParticipant: исходный / новый HR</text><text x="85" y="710" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Ticket: resolution_revision → confirmed_by</text><text x="85" y="741" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Employee → HelpSession → Ticket</text><text x="85" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">HelpSession хранит точку возврата</text><rect x="710" y="535" width="570" height="245" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="710" y="535" width="7" height="245" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="735" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Числа и сигналы</text><text x="735" y="617" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">FeedbackAnalysis → MeetingSignal → manager</text><text x="735" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">NlpEvent(event_id, hash, версия, исходный result)</text><text x="735" y="679" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">DigestSnapshot: окно + числовой снимок</text><text x="735" y="710" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">ExportFile: actor + filters + allowed employee IDs</text><text x="735" y="741" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">AuditEvent: кто, действие, ресурс, время</text><text x="735" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Отчёты не требуют вызова модели</text><rect x="1370" y="535" width="570" height="245" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1370" y="535" width="7" height="245" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="1395" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Надёжность и операции</text><text x="1395" y="617" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Job: dedupe, lease, attempts, due_at</text><text x="1395" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Outbox: recipient, body, status, retry_at</text><text x="1395" y="679" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">State: demo clock, политика сигналов, дайджест</text><text x="1395" y="710" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">PostgreSQL: row locks / SKIP LOCKED</text><text x="1395" y="741" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">MAX — внешняя система, exactly-once нет</text><text x="1395" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Неясные отправки не повторяются вслепую</text><polyline points="630,305 710,305" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1280,305 1370,305" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><polyline points="345,440 345,535" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><polyline points="995,440 995,535" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1655,440 1655,535" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="865" width="1880" height="395" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="85" y="913" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#10293b">Матрица прав / проверяется сервером для каждого действия и конкретных данных</text><text x="85" y="968" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#10293b">Сотрудник</text><text x="620" y="966" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#10293b">Свои материалы, ответы, /ask, /hr, свои обращения и подтверждения</text><text x="85" y="1014" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#10293b">HR-администратор</text><text x="620" y="1012" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#10293b">CRUD в назначенной области: люди, сценарии, опросы, документы, обращения, экспорт</text><text x="85" y="1060" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#10293b">Руководитель подразделения</text><text x="620" y="1058" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#10293b">Свои сотрудники: прогресс и рекомендация встречи; без исходных комментариев NLP</text><text x="85" y="1106" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#10293b">Руководитель HR</text><text x="620" y="1104" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#10293b">Разрешённая область HR, сводные показатели и еженедельные снимки/дайджесты</text><text x="85" y="1152" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#10293b">manage_access — отдельное право</text><text x="620" y="1150" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#10293b">Назначение доверенного доступа, блокировка, ключи и привязка MAX</text><text x="85" y="1198" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#10293b">Ограничения сохраняются во времени</text><text x="620" y="1196" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#10293b">Скопированная ссылка не даёт роли; скачивание повторно проверяет права и TTL</text><text x="60" y="1389" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#64748b">Корсик · архитектура реализации v0.4 · 24.10.2026 · ML — внешний контракт, тестовый режим — stub</text></svg>