<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1420" viewBox="0 0 2000 1420"><rect width="2000" height="1420" fill="#f2f5f8"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><text x="60" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#10293b">Корсик / обработка событий и бизнес-состояния</text><text x="62" y="123" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Транзакционная постановка заданий отделена от сетевой отправки. Переписка с HR не ставит опросы на паузу.</text><rect x="60" y="165" width="570" height="175" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="165" width="7" height="175" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="85" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">1 / входящее событие MAX</text><text x="85" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">poll → normalize_update → ingest</text><text x="85" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Job с уникальным ключом incoming:event_id</text><text x="85" y="309" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Worker блокирует Employee и обрабатывает</text><text x="85" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Повтор события не повторяет бизнес-действие</text><rect x="715" y="165" width="570" height="175" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="715" y="165" width="7" height="175" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="740" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">2 / применение бизнес-правил</text><text x="740" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Команда / callback → нужный use case</text><text x="740" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Проверяются права и текущее состояние</text><text x="740" y="309" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Ответы и Outbox записываются одной</text><text x="740" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">транзакцией вместе со статусом Job</text><rect x="1370" y="165" width="570" height="175" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1370" y="165" width="7" height="175" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="1395" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">3 / фактическая отправка</text><text x="1395" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Worker повторно проверяет доступ</text><text x="1395" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">MAX user binding, материалы и получателя</text><text x="1395" y="309" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Retry — при безопасной ошибке</text><text x="1395" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Неясный результат → uncertain, решение HR</text><polyline points="630,245 715,245" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1285,245 1370,245" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="405" width="890" height="330" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="405" width="7" height="330" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="85" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Календарь → последовательность → опрос</text><text x="85" y="487" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">hire / probation_end + месяцы / дни / рабочий день + timezone</text><text x="85" y="518" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Изменение дат пересчитывает будущие назначения, а не ответы</text><text x="85" y="549" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Позднее подключение: пропущенные шаги ждут решения HR</text><text x="85" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">RouteRun: message → choice → material → survey → wait</text><text x="85" y="611" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Нет файла / персонального плана → waiting_material</text><text x="85" y="642" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">SurveyRun: выбор / оценка / текст / условный комментарий</text><text x="85" y="673" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Промежуточные ответы сохраняются; другое действие ждёт очереди</text><text x="85" y="704" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Истёк дедлайн рассылки: новые ответы не принимаются</text><rect x="1030" y="405" width="910" height="330" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1030" y="405" width="7" height="330" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="1055" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Свободный вопрос → внешний ML → помощь</text><text x="1055" y="487" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">/ask сохраняет исходный вопрос и точку возврата в SurveyRun</text><text x="1055" y="518" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">ML получает разрешённые документы, историю и контекст шага</text><text x="1055" y="549" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">answered + допустимые источники → «Удалось решить вопрос?»</text><text x="1055" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">clarification → уточнение относится к HelpSession, а не к опросу</text><text x="1055" y="611" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">not_found / ошибка / запрещённый источник → честный ответ + HR</text><text x="1055" y="642" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Нет полезного ответа → выбор разрешённого HR или повтор</text><text x="1055" y="673" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">/resume восстанавливает вопрос и ожидание комментария</text><text x="1055" y="704" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Нет режима, который перехватывает все сообщения навсегда</text><rect x="60" y="800" width="890" height="440" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="800" width="7" height="440" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="85" y="843" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Обращение сотрудника → конкретный HR case</text><text x="85" y="882" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">/hr текст создаёт или дополняет выбранное обращение</text><text x="85" y="913" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Несколько открытых обращений → сотрудник выбирает case ID</text><text x="85" y="944" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Разрешённые получатели задаёт HR для площадки</text><text x="85" y="975" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Выбор другого HR сохраняет участников и историю обращения</text><text x="85" y="1006" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">HR Inbox: список сотрудников → сообщения + выбор обращения</text><text x="85" y="1037" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Ответ в боте: «Ваш вопрос: … / Ответ HR: …»</text><text x="85" y="1068" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Предложение решения → awaiting_confirmation с ревизией</text><text x="85" y="1099" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Да → closed / employee_confirmed; Нет → in_progress того же ID</text><text x="85" y="1130" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Старая кнопка, молчание или архивирование не означают решения</text><text x="85" y="1161" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Опросы и рассылки продолжают работать независимо от HR</text><rect x="1030" y="800" width="910" height="440" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1030" y="800" width="7" height="440" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="1055" y="843" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">NLP signal → backend policy → руководитель</text><text x="1055" y="882" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Свободный ответ → analyze Job → внешний /v1/analyze</text><text x="1055" y="913" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Результат и версия обработчика хранятся в FeedbackAnalysis</text><text x="1055" y="944" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Дополнительный адаптер: POST /api/integrations/nlp/events</text><text x="1055" y="975" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Bearer ML key, event_id + hash, answer_id, schema_version</text><text x="1055" y="1006" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Кандидат метки: manager_signal = meeting_recommended</text><text x="1055" y="1037" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Feedback policy решает, требуется ли обращение HR</text><text x="1055" y="1068" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">MeetingSignal уникален для анализа: повтор не дублирует сигнал</text><text x="1055" y="1099" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Получатель определяется backend по текущему manager_id</text><text x="1055" y="1130" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Руководителю — сотрудник и рекомендация личной встречи</text><text x="1055" y="1161" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Исходный отзыв, причина NLP и риск ему не раскрываются</text><text x="60" y="1389" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#64748b">Корсик · архитектура реализации v0.4 · 24.10.2026 · ML — внешний контракт, тестовый режим — stub</text></svg>