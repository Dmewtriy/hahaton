<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1420" viewBox="0 0 2000 1420"><rect width="2000" height="1420" fill="#f2f5f8"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><text x="60" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#10293b">Корсик / развёртывание и границы системы</text><text x="62" y="123" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Модульный Python backend. Одна транзакционная БД, фоновые задания и outbox. Без Redis / Celery на текущем этапе.</text><rect x="60" y="160" width="570" height="160" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="160" width="7" height="160" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="85" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Сотрудник / MAX</text><text x="85" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Приглашение, материалы, ответы на опросы</text><text x="85" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">/ask — ИИ, /hr — отдельное сообщение HR</text><text x="85" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">/resume — точка возврата, /cases — обращения</text><rect x="690" y="160" width="580" height="160" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="690" y="160" width="7" height="160" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="715" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">HR и руководители / Mini App</text><text x="715" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">HTML + CSS + ES modules + MAX Bridge</text><text x="715" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">HR: CRUD, рассылки, документы, выгрузки</text><text x="715" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Руководители: разрешённые данные команды</text><rect x="1330" y="160" width="610" height="160" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1330" y="160" width="7" height="160" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="1355" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Платформа MAX / внешний сервис</text><text x="1355" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Bot API: сообщения, callbacks, вложения</text><text x="1355" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Bridge: подписанные initData для кабинета</text><text x="1355" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">HTTPS-адрес регистрирует владелец бота</text><polyline points="345,320 345,385" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><polyline points="980,320 980,385" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1635,320 1635,385" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="385" width="570" height="164" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="385" width="7" height="164" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="85" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">MAX adapter / poll</text><text x="85" y="467" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Long polling сохраняет событие в Job</text><text x="85" y="498" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Уникальный incoming:event_id → без повтора</text><text x="85" y="529" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Отправка: Outbox → Bot API, отдельный worker</text><rect x="690" y="385" width="580" height="164" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="690" y="385" width="7" height="164" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="715" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Веб-вход / подключение Mini App</text><text x="715" y="467" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Локальный кабинет: localhost:8000</text><text x="715" y="498" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Для MAX требуется публичный HTTPS</text><text x="715" y="529" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Сетевая публикация настраивается отдельно</text><rect x="1330" y="385" width="610" height="164" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1330" y="385" width="7" height="164" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="1355" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">FastAPI / api.py + *_api.py</text><text x="1355" y="467" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Подпись MAX → WebSession → RBAC + scope</text><text x="1355" y="498" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Локально: localhost:8000, вход по ключу</text><text x="1355" y="529" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">В MAX: проверка initData и прав backend</text><polyline points="1270,467 1330,467" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><polyline points="345,549 345,615" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1635,549 1635,615" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="615" width="1880" height="435" rx="15" fill="#eaf1f5" stroke="#acbecb" stroke-width="2"/><text x="85" y="658" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#10293b">Python application / общие use cases для бота, API и worker</text><rect x="85" y="690" width="590" height="160" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="85" y="690" width="7" height="160" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="110" y="733" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Доступ и сотрудники</text><text x="110" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">access · employees · admin_service</text><text x="110" y="803" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">4 рабочие роли + manage_access</text><text x="110" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Площадка, HR, отдел, руководитель</text><rect x="700" y="690" width="590" height="160" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="700" y="690" width="7" height="160" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="725" y="733" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Маршруты и опросы</text><text x="725" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">scenarios · routes · surveys · campaigns</text><text x="725" y="803" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">21 сценарий / 55 исходных строк</text><text x="725" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Снимки конфигурации, календарь, дедлайн</text><rect x="1315" y="690" width="590" height="160" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1315" y="690" width="7" height="160" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="1340" y="733" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Поддержка и AI help</text><text x="1340" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">support · tickets · inbox · helpflow</text><text x="1340" y="803" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">История по сотруднику, отдельные case ID</text><text x="1340" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Решение HR → подтверждение сотрудника</text><rect x="85" y="860" width="590" height="160" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="85" y="860" width="7" height="160" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="110" y="903" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Документы и материалы</text><text x="110" y="942" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">documents · Material / реестр</text><text x="110" y="973" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Версии, права, статус индексации</text><text x="110" y="1004" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Отсутствующий материал блокирует шаг</text><rect x="700" y="860" width="590" height="160" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="700" y="860" width="7" height="160" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="725" y="903" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Аналитика и сигналы</text><text x="725" y="942" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">analytics · reporting · feedback · meetings</text><text x="725" y="973" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">CSV/XLSX считает backend из БД</text><text x="725" y="1004" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Руководителю — рекомендация встречи</text><rect x="1315" y="860" width="590" height="160" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1315" y="860" width="7" height="160" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="1340" y="903" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">ML port / внешний контракт</text><text x="1340" y="942" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">ml.py: StubML или HTTPML</text><text x="1340" y="973" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">/v1/answer, /v1/analyze, documents</text><text x="1340" y="1004" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">nlp_api: адаптер кандидата контракта</text><polyline points="345,1050 345,1110" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><polyline points="980,1050 980,1110" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1635,1050 1635,1110" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="1110" width="570" height="200" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="1110" width="7" height="200" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="85" y="1153" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">PostgreSQL 17</text><text x="85" y="1192" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">SQLAlchemy 2 + Alembic, миграция 0005</text><text x="85" y="1223" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Job: retry, leases, SKIP LOCKED</text><text x="85" y="1254" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Outbox: дедупликация, uncertain delivery</text><text x="85" y="1285" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Состояния диалога, ответы, аудит, доступ</text><rect x="690" y="1110" width="580" height="200" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="690" y="1110" width="7" height="200" rx="15" fill="#177a80" stroke="#177a80" stroke-width="2"/><text x="715" y="1153" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Приватный app_data / Docker volume</text><text x="715" y="1192" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Оригиналы документов и медиа-кеш</text><text x="715" y="1223" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Временные CSV/XLSX, signed download</text><text x="715" y="1254" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Бэкапы перед миграцией и обновлением</text><text x="715" y="1285" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Секреты в .env, не в исходниках</text><rect x="1330" y="1110" width="610" height="200" rx="15" fill="#eaf4f8" stroke="#cbd5e1" stroke-width="2"/><rect x="1330" y="1110" width="7" height="200" rx="15" fill="#3775b2" stroke="#3775b2" stroke-width="2"/><text x="1355" y="1153" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#10293b">Внешний ML сервис коллег</text><text x="1355" y="1192" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Алгоритмы RAG/NLP вне backend</text><text x="1355" y="1223" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Тайм-аут + проверка разрешённых источников</text><text x="1355" y="1254" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Нет подтверждённого ответа → HR</text><text x="1355" y="1285" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#334155">Сейчас можно демонстрировать со stub</text><text x="60" y="1389" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#64748b">Корсик · архитектура реализации v0.4 · 24.10.2026 · ML — внешний контракт, тестовый режим — stub</text></svg>