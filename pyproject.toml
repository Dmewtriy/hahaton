[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "korsik-backend"
version = "0.1.0"
description = "Configurable employee onboarding backend for MAX"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3", "python-multipart>=0.0.18", "tzdata>=2025",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
korsik = "korsik.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
korsik = ["web/*.html", "web/*.css", "web/*.js", "web/brand/*.jpg", "web/brand/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
